<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ChatGPT</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function() {
        try {
          var cached = localStorage.getItem("theme_pref");
          var theme = cached ? JSON.parse(cached).theme : "SYSTEM";
          var isDark = theme === "DARK" || (theme === "SYSTEM" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (isDark) {
            root.setAttribute("data-theme", "dark");
            root.classList.add("dark");
          } else {
            root.setAttribute("data-theme", "light");
            root.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChatGPT" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
  </head>
  <body class="h-full min-h-[100dvh] max-h-[100dvh] overflow-hidden bg-[var(--bg)] text-[var(--text)]">
    <div id="root" class="h-full min-h-[100dvh] max-h-[100dvh] overflow-hidden"></div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
